name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['stable', 'oldstable']

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}
        cache: true

    - name: Download & Verify dependencies
      run: |
        go mod download
        go mod verify

    - name: Run unit tests (Linux / macOS)
      if: runner.os != 'Windows'
      run: go test -v -race ./...

    - name: Run unit tests (Windows)
      if: runner.os == 'Windows'
      run: go test -v ./...

    - name: Run benchmarks
      run: go test -bench=. -benchmem -run=Benchmark ./tests/...

    - name: Build binary
      run: go build -v ./cmd/pingforge
